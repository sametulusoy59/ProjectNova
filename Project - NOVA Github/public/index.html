 const circle=(x,y,r,a=.8,fill=false)=>{

 function nova(cx,cy,sc){
  // Enerji küresi
  const pulse=1+Math.sin(t*2)*.035;
  const r=sc*.48*pulse;

  const grad=g.createRadialGradient(cx,cy,2,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,.95)');
  grad.addColorStop(.15,glow);
  grad.addColorStop(.65,`hsla(${h},100%,50%,.12)`);
  grad.addColorStop(1,'rgba(0,0,0,0)');

  g.globalAlpha=1;
  g.fillStyle=grad;
  g.beginPath();
  g.arc(cx,cy,r*1.5,0,Math.PI*2);
  g.fill();

  g.strokeStyle=col;

  // Kürenin enerji çizgileri
  for(let k=0;k<3;k++){
   g.save();
   g.translate(cx,cy);
   g.rotate(t*.35+k*Math.PI/3);
   g.globalAlpha=.65;
   g.lineWidth=1;
   g.beginPath();
   g.ellipse(0,0,r*.75,r*(.2+k*.08),0,0,Math.PI*2);
   g.stroke();
   g.restore();
  }

  // Dış yörüngeler
  for(let k=0;k<2;k++){
   g.save();
   g.translate(cx,cy);
   g.rotate(-t*.25+k*.8);
   g.globalAlpha=.45;
   g.beginPath();
   g.ellipse(0,0,sc*.67,sc*(.19+k*.07),0,0,Math.PI*2);
   g.stroke();
   g.restore();
  }

  for(let i=0;i<18;i++){
   const a=i/18*Math.PI*2+t*.5;
   const rr=sc*(.57+.08*Math.sin(t*2+i));
   particle(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,2,.5+.4*Math.sin(t+i));
  }

  g.globalAlpha=1;
  label('ENERGY CORE',cx-sc*.4,cy+sc*.78,10);
  label('POWER '+(80+Math.sin(t)*8).toFixed(0)+'%',cx-sc*.4,cy+sc*.88,9,.6);
 }

 function arManual(cx,cy,sc){
  // Akıllı telefon gövdesi
  const w=sc*.52,hh=sc*.88;
  const x=cx-w/2,y=cy-hh/2;

  g.strokeStyle=col;
  g.lineWidth=1.5;
  g.globalAlpha=.9;
  g.beginPath();
  g.roundRect(x,y,w,hh,12);
  g.stroke();

  g.globalAlpha=.3;
  g.fillStyle=col;
  g.fillRect(x+7,y+18,w-14,hh-36);

  // Ekran içindeki AR nesnesi
  g.globalAlpha=.9;
  g.beginPath();
  g.arc(cx,cy-5,sc*.17,0,Math.PI*2);
  g.stroke();

  g.beginPath();
  g.moveTo(cx,cy-sc*.38);
  g.lineTo(cx,cy+sc*.35);
  g.moveTo(cx-sc*.25,cy);
  g.lineTo(cx+sc*.25,cy);
  g.stroke();

  // AR tarama kutusu
  const bx=cx+Math.sin(t)*sc*.08;
  const by=cy-5+Math.cos(t)*sc*.06;
  const q=sc*.24;

  g.globalAlpha=.8;
  g.strokeRect(bx-q,by-q,bx? q*2:q*2,q*2);

  // Köşe işaretleri
  const corners=[
   [bx-q,by-q,1,1],[bx+q,by-q,-1,1],
   [bx-q,by+q,1,-1],[bx+q,by+q,-1,-1]
  ];

  corners.forEach(([px,py,dx,dy])=>{
   line(px,py,px+dx*10,py,.95,2);
   line(px,py,px,py+dy*10,.95,2);
  });

  // Telefon dışındaki bağlantı noktaları
  for(let i=0;i<4;i++){
   const yy=cy-sc*.35+i*sc*.23;
   line(x-sc*.23,yy,x-5,yy,.45);
   particle(x-sc*.23,yy,2,.8);
  }

  g.globalAlpha=1;
  label('AR TRACKING',cx-sc*.48,cy+sc*.7,9);
  label('3D OBJECT DETECTED',cx-sc*.48,cy+sc*.8,8,.65);
 }

 function textSimilarity(cx,cy,sc){
  const docW=sc*.43,docH=sc*.65;
  const left=cx-sc*.48, right=cx+sc*.05;
  const top=cy-docH/2;

  // İki dijital belge
  [left,right].forEach((x,index)=>{
   g.globalAlpha=.8;
   g.strokeStyle=col;
   g.lineWidth=1.2;
   g.strokeRect(x,top,docW,docH);

   for(let j=0;j<6;j++){
    const yy=top+sc*.12+j*sc*.075;
    line(x+sc*.07,yy,x+docW*(j===2?.65:.88),yy,.45);
   }

   label(index===0?'TEXT A':'TEXT B',x,top-10,9);
  });

  // Karşılaştırma bağlantıları
  for(let i=0;i<5;i++){
   const y1=top+sc*.13+i*sc*.09;
   const y2=top+sc*.13+((i*2)%5)*sc*.09;
   const mid=cx;

   g.strokeStyle=col;
   line(left+docW,y1,right,y2,.25+.45*Math.abs(Math.sin(t+i)),1);

   particle(mid+Math.sin(t*1.5+i)*sc*.025,(y1+y2)/2,2,.8);
  }

  // Benzerlik göstergesi
  const pct=75+Math.sin(t*1.5)*8;
  g.globalAlpha=.8;
  g.strokeStyle=col;
  g.beginPath();
  g.arc(cx,cy+sc*.55,sc*.12,Math.PI,Math.PI*2);
  g.stroke();

  g.globalAlpha=1;
  label('%'+pct.toFixed(1)+' SIMILARITY',cx-sc*.33,cy+sc*.76,10);
  label('TEXT ANALYSIS',cx-sc*.3,cy+sc*.88,8,.6);
 }

 function coronaData(cx,cy,sc){
  // Türkiye'nin stilize edilmiş harita silüeti
  const pts=[
   [-.52,-.12],[-.38,-.2],[-.25,-.17],[-.12,-.23],
   [.02,-.17],[.15,-.22],[.28,-.15],[.43,-.2],
   [.55,-.1],[.48,.02],[.35,.08],[.25,.18],
   [.1,.14],[-.02,.22],[-.18,.16],[-.32,.2],
   [-.43,.1],[-.55,.08]
  ];

  g.save();
  g.translate(cx,cy);
  g.scale(sc,sc);
  g.strokeStyle=col;
  g.lineWidth=.009;
  g.globalAlpha=.85;
  g.beginPath();

  pts.forEach(([x,y],i)=>{
   if(i===0)g.moveTo(x,y);
   else g.lineTo(x,y);
  });

  g.closePath();
  g.stroke();
  g.restore();

  // Veri noktaları
  for(let i=0;i<24;i++){
   const a=i*2.399;
   const rr=.08+(i%7)*.055;
   const x=cx+Math.cos(a)*sc*rr;
   const y=cy+Math.sin(a)*sc*rr*.5;

   const pulse=2+Math.abs(Math.sin(t*2+i))*3;
   g.strokeStyle=col;
   circle(x,y,pulse,.55);

  }

  // Veri panelleri
  const bars=8;
  for(let i=0;i<bars;i++){
   const bh=sc*(.08+.16*(.5+.5*Math.sin(t+i*.8)));
   const x=cx-sc*.48+i*sc*.13;
   const y=cy+sc*.52;
   g.globalAlpha=.65;
   g.fillStyle=col;
   g.fillRect(x,y-bh,sc*.055,bh);
  }

  g.globalAlpha=1;
  label('TURKEY / LIVE DATA',cx-sc*.48,cy-sc*.48,9);
  label('DATA VISUALIZATION',cx-sc*.48,cy+sc*.82,9,.7);
 }
