:root{--bg:#02040A;--deep:#050B16;--blue:#0088FF;--cyan:#00D9FF;--ice:#F4FBFF;--mut:#91A4BC;--disp:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--body:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Space Mono',ui-monospace,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ice);font:400 17px/1.7 var(--body);overflow-x:hidden}

:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

#flash{position:fixed;inset:0;background:var(--ice);opacity:0;z-index:4;pointer-events:none}
nav{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:calc(env(safe-area-inset-top,0px) + .9rem) clamp(1rem,4vw,2.5rem) .9rem;font:400 .75rem var(--mono);letter-spacing:.08em}

nav a{text-decoration:none;color:var(--mut)}nav a:hover{color:var(--cyan)}
nav .brand{color:var(--ice)}
.lang{font:inherit;background:none;border:1px solid rgba(0,217,255,.4);color:var(--cyan);padding:.35rem .7rem;cursor:pointer;border-radius:2px}

@keyframes scan{from{top:8%}to{top:92%}}

p{max-width:62ch}.mut{color:var(--mut)}

.card img{-webkit-user-drag:none}
.card{--s:.92;--o:.5;flex:0 0 var(--cw);scroll-snap-align:center;scroll-snap-stop:always;text-align:left;background:rgba(5,11,22,.72);border:1px solid rgba(145,164,188,.22);color:inherit;font:inherit;padding:0;cursor:pointer;border-radius:4px;overflow:hidden;transform:scale(var(--s));opacity:var(--o);transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .45s,border-color .35s,box-shadow .35s}
.card.on{--s:1;--o:1}
.card:hover,.card:focus-visible{--o:1;transform:translateY(-5px) scale(var(--s));border-color:var(--cyan);box-shadow:0 12px 40px -12px rgba(0,136,255,.55)}
.orb{aspect-ratio:16/10;position:relative;background:radial-gradient(circle at 50% 50%,hsl(var(--h) 100% 70%) 0,hsl(var(--h) 100% 45%) 14%,hsl(var(--h) 90% 20%) 38%,#02040A 72%);overflow:hidden}

.tags{display:flex;flex-wrap:wrap;gap:.4rem}

.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2rem}

.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;max-width:760px;margin:0 auto 4rem}
.cv{grid-column:1/-1;position:relative;overflow:hidden;display:flex;align-items:center;gap:1.1rem;padding:1.15rem 1.4rem;text-align:left;text-decoration:none;color:var(--ice);border:1px solid rgba(0,217,255,.45);background:linear-gradient(120deg,rgba(0,136,255,.2),rgba(0,217,255,.06) 55%,rgba(5,11,22,.5));transition:transform .3s,box-shadow .3s,border-color .3s}

function holo(cv,h,s){
 cancelAnimationFrame(holoRaf);

 const g=cv.getContext('2d');
 const dp=Math.min(devicePixelRatio||1,2);
 const W=cv.clientWidth,H=cv.clientHeight;

 cv.width=W*dp;
 cv.height=H*dp;
 g.setTransform(dp,0,0,dp,0,0);

 const col=`hsl(${h} 100% 65%)`;
 const glow=`hsla(${h},100%,65%,.35)`;
 let t=0;

 const line=(x1,y1,x2,y2,a=.7,w=1)=>{
  g.globalAlpha=a;
  g.lineWidth=w;
  g.beginPath();
  g.moveTo(x1,y1);
  g.lineTo(x2,y2);
  g.stroke();
 };

 const circle=(x,y,r,a=.8,fill=false)=>{
  g.globalAlpha=a;
  g.beginPath();
  g.arc(x,y,r,0,Math.PI*2);
  if(fill)g.fill();else g.stroke();
 };

 const label=(txt,x,y,size=10,a=.8)=>{
  g.globalAlpha=a;
  g.font=`${size}px monospace`;
  g.fillText(txt,x,y);
 };

 const particle=(x,y,r=2,a=.8)=>{
  g.globalAlpha=a;
  g.beginPath();
  g.arc(x,y,r,0,Math.PI*2);
  g.fill();
 };

 function nova(cx,cy,sc){
  // Enerji küresi
  const pulse=1+Math.sin(t*2)*.035;
  const r=sc*.48*pulse;

  const grad=g.createRadialGradient(cx,cy,2,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,.95)');
  grad.addColorStop(.15,glow);
  grad.addColorStop(.65,`hsla(${h},100%,50%,.12)`);
  grad.addColorStop(1,'rgba(0,0,0,0)');

  g.globalAlpha=1;
  g.fillStyle=grad;
  g.beginPath();
  g.arc(cx,cy,r*1.5,0,Math.PI*2);
  g.fill();

  g.strokeStyle=col;

  // Kürenin enerji çizgileri
  for(let k=0;k<3;k++){
   g.save();
   g.translate(cx,cy);
   g.rotate(t*.35+k*Math.PI/3);
   g.globalAlpha=.65;
   g.lineWidth=1;
   g.beginPath();
   g.ellipse(0,0,r*.75,r*(.2+k*.08),0,0,Math.PI*2);
   g.stroke();
   g.restore();
  }

  // Dış yörüngeler
  for(let k=0;k<2;k++){
   g.save();
   g.translate(cx,cy);
   g.rotate(-t*.25+k*.8);
   g.globalAlpha=.45;
   g.beginPath();
   g.ellipse(0,0,sc*.67,sc*(.19+k*.07),0,0,Math.PI*2);
   g.stroke();
   g.restore();
  }

  for(let i=0;i<18;i++){
   const a=i/18*Math.PI*2+t*.5;
   const rr=sc*(.57+.08*Math.sin(t*2+i));
   particle(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,2,.5+.4*Math.sin(t+i));
  }

  g.globalAlpha=1;
  label('ENERGY CORE',cx-sc*.4,cy+sc*.78,10);
  label('POWER '+(80+Math.sin(t)*8).toFixed(0)+'%',cx-sc*.4,cy+sc*.88,9,.6);
 }

 function arManual(cx,cy,sc){
  // Akıllı telefon gövdesi
  const w=sc*.52,hh=sc*.88;

  g.strokeStyle=col;

  g.stroke();

  g.lineTo(cx,cy+sc*.35);
  g.moveTo(cx-sc*.25,cy);
  g.lineTo(cx+sc*.25,cy);

  // AR tarama kutusu

   line(px,py,px+dx*10,py,.95,2);
